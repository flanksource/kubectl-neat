name: CI
on: 
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Check gofmt
        run: test -z "$(gofmt -s -d .)"
      
      - name: Build
        run: make build

      - name: Test
        run: make test-unit
